<!doctype html>
<html lang="en">
<!--
  EricMillington.com: Eric's hand-drawn mockup (source.jpg) cut into pieces along its pen strokes (p-*.jpg).
  Desktop: every piece is placed at its exact original position, so the page matches the drawing.
  Phones (≤ 720px): the same pieces stack vertically at a readable size.
  Real links, inputs and the Go! button sit on top of the drawn boxes, positioned in % of their piece.
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eric Millington — I make things on the web and get people noticed online</title>
  <meta name="description" content="Hi! I'm Eric. I make things on the web and get people noticed online. Let's work together.">
  <link rel="canonical" href="https://ericmillington.com/">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Eric Millington">
  <meta property="og:description" content="I make things on the web and get people noticed online.">
  <meta property="og:image" content="https://ericmillington.com/source.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
  <script type="application/ld+json">
  { "@context": "https://schema.org", "@type": "Person", "name": "Eric Millington", "url": "https://ericmillington.com/", "description": "I make things on the web and get people noticed online." }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; background: #000; }
    body { color: #fff; font-family: "Architects Daughter", "Comic Sans MS", cursive; }
    .sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Desktop: pieces placed exactly where they are in the drawing */
    .sheet { position: relative; width: min(100%, 1100px); margin: 0 auto; aspect-ratio: 2048 / 2121; container-type: inline-size; }
    .piece { position: absolute; display: block; }
    .piece > img { display: block; width: 100%; height: auto; mix-blend-mode: lighten; }  /* black never hides another piece */
    header, main, footer, nav, form { display: contents; }

    .hot { position: absolute; display: block; }
    a.hot, button.hot { color: transparent; background: transparent; border: 0; padding: 0; cursor: pointer; border-radius: 8px; transition: box-shadow .2s, background-color .2s; }
    a.hot:hover, button.hot:hover { background: rgb(120 220 120 / .08); box-shadow: 0 0 22px rgb(120 220 120 / .35); }
    a.hot:focus-visible, button.hot:focus-visible { outline: 2px dashed #9fe59f; outline-offset: 4px; }
    .hot input {
      width: 100%; height: 100%; border: 0; margin: 0; padding: 0 4%;
      background: transparent; color: #fff; caret-color: #9fe59f; border-radius: 8px;
      font: 2.3cqw/1 "Architects Daughter", "Comic Sans MS", cursive; text-transform: uppercase; letter-spacing: .05em;
      transition: background-color .2s;
    }
    .hot input:focus { outline: none; background: rgb(120 220 120 / .1); }
    .hot input:user-invalid { background: rgb(255 90 90 / .14); }
    .thanks { margin: 0; color: #9fe59f; text-transform: uppercase; letter-spacing: .08em; font-size: 2.4cqw; line-height: 1; text-align: center; white-space: nowrap; }

    /* Phones: same drawn pieces, stacked */
    @media (max-width: 720px) {
      .sheet { aspect-ratio: auto; width: 100%; padding: 16px 16px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; row-gap: 28px; }
      .piece { position: relative; left: auto !important; top: auto !important; }
      .p-logo { width: 52% !important; }
      .p-contact { width: 44% !important; }
      .p-face { width: 62% !important; margin: 12px auto 0; }
      .p-hi, .p-heading, .p-form, .p-line { width: 100% !important; }
      .p-heading { margin-top: 24px; }
      .p-website { width: 80% !important; margin: 8px auto 0; }
      .p-line { margin-top: 24px; }
      .p-ftext { width: 64% !important; }
      .p-flinks { width: 30% !important; }
      .hot input { font-size: 16px; }          /* 16px stops iOS zooming in on focus */
      .thanks { font-size: 15px; }
    }

    /* Boiling lines: the pen strokes shimmer like hand-drawn animation frames
       (on hover over a drawn link, and on the section you land on after clicking one) */
    html { scroll-behavior: smooth; }
    @keyframes boil { 0% { filter: url(#boil-1) } 33% { filter: url(#boil-2) } 66% { filter: url(#boil-3) } }
    .piece:has(> a.hot:hover) > img, .is-boiling > img { animation: boil .36s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .piece > img { animation: none !important; }
    }

    /* Line boil on the drawn buttons, all the time (a bit faster when pointed at) */
    .p-contact > img, .p-go { animation: boil .45s steps(1) infinite; }
    .p-go { position: absolute; display: block; height: auto; mix-blend-mode: lighten; pointer-events: none; }
    .piece:has(> a.hot:hover) > img, .p-form:has(button.hot:hover) .p-go { animation-duration: .2s; }
    @media (prefers-reduced-motion: reduce) { .p-go { animation: none !important; } }
  </style>
</head>
<body id="top">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="boil-1"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
    <filter id="boil-2"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
    <filter id="boil-3"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="13"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
  </svg>
  <div class="sheet">
    <header>
      <div class="piece p-logo" style="left:3.906%;top:0.849%;width:26.367%"><img src="p-logo.jpg" width="540" height="209" alt=""><a class="hot" href="#top" style="left:0;top:0;width:100%;height:100%"><h1 class="sr-only">Eric Millington website</h1><span class="sr-only">Home</span></a></div>
      <div class="piece p-contact" style="left:65.283%;top:1.603%;width:28.613%"><img src="p-contact.jpg" width="586" height="151" alt=""><a class="hot" href="#contact" style="left:5.97%;top:14.57%;width:91.81%;height:69.54%">Contact me</a></div>
    </header>

    <main>
      <div class="piece p-face" style="left:9.180%;top:13.107%;width:25.928%"><img src="p-face.jpg" width="531" height="614" alt="Hand-drawn portrait of Eric in a baseball cap, with a beard and a smile"></div>
      <div class="piece p-hi" style="left:37.988%;top:16.690%;width:48.242%"><img src="p-hi.jpg" width="988" height="435" alt="Hi! I'm Eric and I make things on the web and get people noticed online."></div>

      <div class="piece p-heading" id="contact" style="left:7.275%;top:44.460%;width:50.146%"><img src="p-heading.jpg" width="1027" height="163" alt=""><h2 class="sr-only">Let's work together</h2></div>
      <!-- Messages go to Formspree, which emails them to Eric. Set action back to "#" for demo mode. -->
      <form name="contact" action="https://formspree.io/f/xbggzdpo" method="post" data-thanks>
        <input type="hidden" name="_subject" value="New message from ericmillington.com">
        <div class="sr-only" aria-hidden="true"><label for="f-gotcha">Leave this empty</label><input id="f-gotcha" type="text" name="_gotcha" tabindex="-1" autocomplete="off"></div>
        <div class="piece p-form" style="left:8.838%;top:52.947%;width:48.193%"><img src="p-form.jpg" width="987" height="626" alt="">
          <div class="hot" style="left:32.83%;top:4.31%;width:57.24%;height:11.98%"><label class="sr-only" for="f-name">Name</label><input id="f-name" name="name" type="text" autocomplete="name" required></div>
          <div class="hot" style="left:34.35%;top:27.48%;width:56.74%;height:11.98%"><label class="sr-only" for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
          <div class="hot" style="left:35.87%;top:52.24%;width:55.22%;height:12.78%"><label class="sr-only" for="f-phone">Phone</label><input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel"></div>
          <img class="p-go" src="p-go.jpg" width="445" height="180" alt="" style="left:56.13%;top:73.802%;width:45.086%">
          <button class="hot" type="submit" style="left:61.20%;top:80.19%;width:34.45%;height:14.38%">Go!</button>
          <p class="hot thanks" role="status" style="left:0;top:100%;width:100%;height:auto;padding-top:1.5%"></p>
        </div>
      </form>
      <div class="piece p-website" style="left:61.182%;top:42.150%;width:32.568%"><img src="p-website.jpg" width="667" height="749" alt="A hand-drawn sketch of a website layout, labeled: Website!"></div>
    </main>

    <footer>
      <div class="piece p-line" style="left:8.789%;top:84.913%;width:86.377%"><img src="p-line.jpg" width="1769" height="96" alt=""></div>
      <div class="piece p-ftext" style="left:32.520%;top:87.364%;width:34.814%"><img src="p-ftext.jpg" width="713" height="88" alt="This is a footer"></div>
      <nav aria-label="Footer">
        <div class="piece p-flinks" style="left:81.006%;top:88.213%;width:14.160%"><img src="p-flinks.jpg" width="290" height="175" alt="">
          <a class="hot" href="#top" style="left:3.79%;top:-0.57%;width:65.52%;height:48.57%">Home</a>
          <a class="hot" href="#contact" style="left:0.34%;top:59.43%;width:96.55%;height:40.00%">Contact</a>
        </div>
      </nav>
    </footer>
  </div>

  <script>
    /* Contact form. With action="#" it's a demo: it just shows the thank-you line.
       With a Formspree URL it sends the message in the background, so the visitor stays on the page. */
    (function () {
      var form = document.querySelector("form[data-thanks]");
      var status = form.querySelector(".thanks");
      var button = form.querySelector('button[type="submit"]');
      var say = function (text, isError) { status.textContent = text; status.style.color = isError ? "#ff9b8a" : ""; };

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var action = form.getAttribute("action");
        if (!action || action === "#") { say("Thanks! Talk soon."); form.reset(); return; }

        button.disabled = true;
        say("Sending…");
        fetch(action, { method: "POST", body: new FormData(form), headers: { Accept: "application/json" } })
          .then(function (res) {
            if (!res.ok) throw new Error(res.status);
            say("Thanks! Talk soon.");
            form.reset();
          })
          .catch(function () {
            say("That didn't send. Please try again in a minute.", true);
          })
          .then(function () { button.disabled = false; });
      });
    })();
  </script>
  <script>
    /* Boil the section you land on after clicking a drawn link (Contact me, your name, Home, Contact). */
    (function () {
      var groups = { "#contact": [".p-heading", ".p-form"], "#top": [".p-logo", ".p-face", ".p-hi"] };
      var timer;
      document.addEventListener("click", function (e) {
        var a = e.target.closest('a[href^="#"]');
        var pieces = a && groups[a.getAttribute("href")];
        if (!pieces) return;
        clearTimeout(timer);
        var boil = function () {
          pieces.forEach(function (sel) { var el = document.querySelector(sel); if (el) el.classList.add("is-boiling"); });
          setTimeout(function () { document.querySelectorAll(".is-boiling").forEach(function (el) { el.classList.remove("is-boiling"); }); }, 1100);
        };
        /* wait for the smooth scroll to finish (scrollend where supported, else a short delay) */
        if ("onscrollend" in window) {
          var startY = scrollY;
          var done = function () { removeEventListener("scrollend", done); clearTimeout(timer); boil(); };
          addEventListener("scrollend", done);
          timer = setTimeout(function () {  /* already in place: nothing scrolled, so boil right away */
            if (scrollY === startY) done(); else timer = setTimeout(done, 1500);
          }, 150);
        } else {
          timer = setTimeout(boil, 600);
        }
      });
    })();
  </script>
</body>
</html>
